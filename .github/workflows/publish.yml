name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish, e.g. v0.4.0"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.repository == 'boozedog/pi-codemode'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid tag format: $TAG" >&2
            exit 1
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install host CLIs used by tests
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: npm ci
      - run: npm run check

      - name: Require tag to match package.json version
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          TAG="$TAG_NAME"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$PKG"

      - run: npm install -g npm@^11.15.0
      - run: npm stage publish --access public
